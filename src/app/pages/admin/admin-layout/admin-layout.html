<div class="flex min-h-screen bg-slate-50">
  <!-- Sidebar -->
  <aside class="flex w-64 flex-shrink-0 flex-col bg-slate-900">
    <!-- Brand -->
    <div class="flex items-center gap-2 px-6 py-6">
      <span class="h-8 w-8 rounded-lg bg-orange-500"></span>
      <span class="text-lg font-bold">
        <span class="text-white">Tech</span><span class="text-orange-500">Gear</span>
      </span>
    </div>

    <!-- Nav -->
    <nav class="flex flex-1 flex-col gap-1 px-3" aria-label="Navigation admin">
      <a
        routerLink="/admin"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        Tableau de bord
      </a>

      <a
        routerLink="/admin/products"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7 12 3 4 7m16 0-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        Produits
      </a>

      <a
        routerLink="/admin/categories"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10M4 18h6" />
        </svg>
        Catégories
      </a>

      <a
        routerLink="/admin/orders"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 7h6m-6 4h6" />
        </svg>
        Commandes
      </a>

      <a
        routerLink="/admin/reviews"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2Z" />
        </svg>
        Avis
      </a>

      <a
        routerLink="/admin/users"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Utilisateurs
      </a>

      <a
        routerLink="/admin/newsletter"
        routerLinkActive="bg-slate-800 text-white border-orange-500"
        class="flex items-center gap-3 rounded-lg border-l-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 0 0 2.22 0L21 8M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2Z" />
        </svg>
        Newsletter
      </a>
    </nav>

    <!-- Footer -->
    <div class="border-t border-slate-800 px-3 py-4">
      <a
        routerLink="/"
        class="mb-4 flex items-center gap-2 px-3 text-sm font-medium text-slate-400 transition hover:text-white"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Retour à la boutique
      </a>

      <div class="flex items-center gap-3 rounded-lg px-3 py-2">
        <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-orange-500 text-sm font-semibold text-white">
          {{ (currentUser()?.email ?? '?').charAt(0).toUpperCase() }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-white">
            {{ currentUser()?.email }}
          </p>
          <p class="text-xs font-medium uppercase tracking-wide text-orange-500">
            {{ currentUser()?.role }}
          </p>
        </div>
        <button
          (click)="logout()"
          type="button"
          aria-label="Se déconnecter"
          class="flex-shrink-0 text-slate-500 transition hover:text-white"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="min-w-0 flex-1 p-8">
    <router-outlet></router-outlet>
  </main>
</div>
