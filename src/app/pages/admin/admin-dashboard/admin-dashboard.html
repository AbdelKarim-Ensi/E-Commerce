<div class="p-8">
  <h1 class="text-2xl font-bold text-slate-900">Tableau de bord</h1>
  <p class="mt-1 text-sm text-gray-500">Vue d'ensemble de votre boutique.</p>

  <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
    <a
      routerLink="/admin/products"
      class="flex items-center gap-4 rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
    >
      <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-orange-50">
        <lucide-icon [img]="Package" class="text-orange-600" [size]="24" [strokeWidth]="1.8" />
      </div>
      <div>
        <h2 class="font-semibold text-slate-900">Produits</h2>
        <p class="text-sm text-gray-500">Gérer le catalogue</p>
      </div>
    </a>

    <a
      routerLink="/admin/orders"
      class="flex items-center gap-4 rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
    >
      <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-blue-50">
        <lucide-icon [img]="ClipboardList" class="text-blue-600" [size]="24" [strokeWidth]="1.8" />
      </div>
      <div>
        <h2 class="font-semibold text-slate-900">Commandes</h2>
        <p class="text-sm text-gray-500">Suivre les commandes clients</p>
      </div>
    </a>
  </div>
</div>
