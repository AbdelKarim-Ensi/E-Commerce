<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <div class="flex items-end justify-between mb-10">
      <div>
        <p class="text-amber-500 font-semibold text-sm mb-1 tracking-wide uppercase">Browse</p>
        <h2 class="text-3xl font-black text-gray-900 font-display">Shop by Category</h2>
      </div>
      <button class="text-sm text-amber-500 hover:text-amber-600 font-medium flex items-center gap-1">
        View all →
      </button>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
      @for (cat of categories; track cat.id) {
        <button
          (click)="selectCategory.emit(cat.id)"
          class="category-card group flex flex-col items-center gap-3 p-5 rounded-2xl border-2 border-gray-100 bg-white transition-all"
        >
          @if (cat.image) {
            <img [src]="cat.image" [alt]="cat.name"
                 class="w-10 h-10 object-contain transition-transform duration-200 group-hover:scale-110"/>
          } @else if (cat.emoji) {
            <div class="text-4xl transition-transform duration-200 group-hover:scale-110">
              {{ cat.emoji }}
            </div>
          } @else {
            <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 font-bold
                        flex items-center justify-center text-lg transition-transform duration-200
                        group-hover:scale-110">
              {{ cat.name.charAt(0) }}
            </div>
          }

          <div class="text-center">
            <div class="font-semibold text-sm font-display text-gray-800 transition-colors">
              {{ cat.name }}
            </div>
            @if (cat.count !== undefined) {
              <div class="text-xs text-gray-400 mt-0.5">{{ cat.count }} items</div>
            }
          </div>
        </button>
      }
    </div>

  </div>
</section>
