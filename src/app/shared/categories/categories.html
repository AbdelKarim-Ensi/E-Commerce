<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-end justify-between mb-10">
      <div>
        <p class="text-amber-500 font-semibold text-sm mb-1 tracking-wide uppercase">Browse</p>
        <h2 class="text-3xl font-black text-gray-900 font-poppins">Shop by Category</h2>
      </div>
      <button
        type="button"
        class="text-sm text-amber-500 hover:text-amber-600 font-medium flex items-center gap-1 transition-colors"
      >
        View all <span>→</span>
      </button>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
      @for (cat of categories; track cat.id) {
        <button
          type="button"
          (click)="onSelect(cat.id)"
          class="group flex flex-col items-center gap-3 p-5 rounded-2xl border-2 transition-all cursor-pointer text-center"
          [class.border-amber-400]="isActive(cat.id)"
          [class.bg-amber-50]="isActive(cat.id)"
          [class.shadow-lg]="isActive(cat.id)"
          [class.shadow-amber-100]="isActive(cat.id)"
          [class.border-gray-100]="!isActive(cat.id)"
          [class.bg-white]="!isActive(cat.id)"
          [class.hover:border-amber-300]="!isActive(cat.id)"
        >
          <div
            class="text-4xl transition-transform duration-200 group-hover:scale-110"
            [class.scale-110]="isActive(cat.id)"
          >
            {{ cat.emoji || defaultEmoji }}
          </div>
          <div>
            <div
              class="font-semibold text-sm transition-colors font-poppins"
              [class.text-amber-600]="isActive(cat.id)"
              [class.text-gray-800]="!isActive(cat.id)"
            >
              {{ cat.name }}
            </div>
            @if (cat.count !== undefined) {
              <div class="text-xs text-gray-400 mt-0.5">{{ cat.count }} items</div>
            }
          </div>
        </button>
      }
    </div>
  </div>
</section>
