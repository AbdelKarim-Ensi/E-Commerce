<div 
  (click)="selectProduct.emit(product)"
  class="group relative bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col h-full cursor-pointer"
>
  <!-- Image Produit & Bouton Cœur -->
  <div class="relative aspect-square bg-gray-50 overflow-hidden">
    <img 
      [src]="product.imageUrl" 
      [alt]="product.name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    />

   

    <!-- Bouton Wishlist de la Carte Produit -->
    <button
      type="button"
      (click)="onWishlistClick($event)"
      class="absolute top-3 right-3 w-9 h-9 rounded-full flex items-center justify-center shadow-md transition-all duration-200 z-10 hover:scale-110 active:scale-95"
      [class.bg-red-50]="wishlisted"
      [class.bg-white]="!wishlisted"
      [class.animate-pop]="isAnimating"
      [attr.aria-label]="wishlisted ? 'Remove from wishlist' : 'Add to wishlist'"
    >
      <svg 
        class="w-5 h-5 transition-colors duration-200"
        [class.text-red-500]="wishlisted"
        [class.fill-red-500]="wishlisted"
        [class.text-gray-400]="!wishlisted"
        [class.fill-none]="!wishlisted"
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        stroke-width="2"
      >
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" 
        />
      </svg>
    </button>
  </div>

  <!-- Contenu / Détails Produit -->
  <div class="p-5 flex flex-col flex-1 justify-between">
    <div>
      <p class="text-xs font-semibold text-amber-500 uppercase tracking-wider mb-1">{{ product.brand }}</p>
      <h3 class="font-bold text-gray-900 line-clamp-1 group-hover:text-amber-500 transition-colors">{{ product.name }}</h3>
    </div>

    <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-50">
      <span class="text-xl font-black text-gray-900">${{ product.price }}</span>
      <button
        type="button"
        (click)="onCartClick($event)"
        class="w-9 h-9 rounded-xl bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center shadow-md active:scale-95 transition-all"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>
  </div>
</div>
