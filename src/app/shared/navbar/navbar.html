<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.bg-white/95]="scrolled"
  [class.backdrop-blur-md]="scrolled"
  [class.shadow-sm]="scrolled"
  [class.bg-white/90]="!scrolled"
  [class.backdrop-blur-sm]="!scrolled"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-center gap-4 h-16">
      
      <a routerLink="/" class="flex items-center gap-2 flex-shrink-0 cursor-pointer">
        <div class="w-8 h-8 bg-amber-400 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm font-display">T</span>
        </div>
        <span class="text-lg font-bold text-gray-900 hidden sm:block font-display">
          Tech<span class="text-amber-500">Gear</span>
        </span>
      </a>

      <div class="relative hidden md:block" #dropRef>
        <button
          type="button"
          (click)="toggleCategoryDropdown()"
          class="flex items-center gap-1.5 text-sm font-medium text-gray-700 hover:text-amber-500 transition-colors px-3 py-2 rounded-lg hover:bg-amber-50"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          Categories
          <svg class="w-3.5 h-3.5 transition-transform duration-200" [class.rotate-180]="catOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        @if (catOpen) {
          <div class="absolute top-full left-0 mt-2 w-52 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50">
            @for (cat of categories; track cat.id) {
              <button
                type="button"
                [routerLink]="['/products']"
                [queryParams]="{ category: cat.id }"
                (click)="closeCategoryDropdown()"
                class="w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-amber-50 hover:text-amber-600 transition-colors"
              >
                {{ cat.name }}
              </button>
            }
          </div>
        }
      </div>

      <div class="flex-1 max-w-xl">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            type="text"
            placeholder='Search "wireless earbuds", "smartwatch"...'
            [value]="searchQuery"
            (input)="onSearchInput($event)"
            class="w-full pl-10 pr-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition-all placeholder-gray-400"
          />
        </div>
      </div>

      <div class="flex items-center gap-1">
        
        <button 
          type="button" 
          [routerLink]="['/products']"
          [queryParams]="{ wishlist: true }"
          class="relative p-2.5 text-gray-600 hover:text-amber-500 hover:bg-amber-50 rounded-lg transition-colors group"
          aria-label="Wishlist"
        >
          <svg 
            class="w-5 h-5 text-gray-600 group-hover:text-amber-500 transition-colors" 
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
          
          @if (wishlistCount > 0) {
            <span class="absolute top-1 right-1 min-w-[18px] h-[18px] px-1 bg-amber-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow-sm">
              {{ wishlistCount }}
            </span>
          }
        </button>

        <div
          class="relative hidden sm:block"
          (mouseenter)="onUserMenuMouseEnter()"
          (mouseleave)="onUserMenuMouseLeave()"
        >
          <button
            type="button"
            (click)="toggleUserMenu($event)"
            class="p-2.5 text-gray-600 hover:text-amber-500 hover:bg-amber-50 rounded-lg transition-colors"
            [attr.aria-label]="isLoggedIn ? 'Account menu' : 'Sign in or sign up'"
            aria-haspopup="menu"
            [attr.aria-expanded]="userMenuOpen"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>

          @if (userMenuOpen) {
            <div
              role="menu"
              class="absolute top-full right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden z-50"
              (click)="$event.stopPropagation()"
            >
              <div class="px-4 py-3 border-b border-gray-100">
                <p class="text-sm font-medium text-gray-400">Welcome to TechGear</p>
              </div>

              <div class="p-2">
                @if (isLoggedIn) {
                  <a
                    routerLink="/orders"
                    role="menuitem"
                    (click)="closeUserMenu()"
                    class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-xl transition-colors"
                  >
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 7h6m-6 4h6" />
                    </svg>
                    My Orders
                  </a>
                  <button
                    type="button"
                    role="menuitem"
                    (click)="goToProfile()"
                    class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-xl transition-colors"
                  >
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    My Profile
                  </button>
                  <button
                    type="button"
                    role="menuitem"
                    (click)="logout()"
                    class="w-full mt-1 flex items-center justify-center gap-2 px-3 py-3 bg-gray-900 hover:bg-gray-800 text-white text-sm font-bold rounded-xl transition-colors"
                  >
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17l5-5-5-5" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12H9" />
                    </svg>
                    Logout
                  </button>
                } @else {
                  <a
                    routerLink="/login"
                    role="menuitem"
                    (click)="closeUserMenu()"
                    class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-xl transition-colors"
                  >
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 17l5-5-5-5" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12H3" />
                    </svg>
                    Sign in
                  </a>
                  <a
                    routerLink="/register"
                    role="menuitem"
                    (click)="closeUserMenu()"
                    class="w-full mt-1 flex items-center justify-center gap-2 px-3 py-3 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition-colors"
                  >
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2" />
                      <circle cx="9" cy="7" r="4" stroke-width="2" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 8v6M22 11h-6" />
                    </svg>
                    Sign up — it's free
                  </a>
                }
              </div>
            </div>
          }
        </div>

        @if (isAdmin) {
          <a
            routerLink="/admin"
            class="flex items-center gap-2 px-3 py-2 border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-colors ml-1"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1" stroke-width="2" />
              <rect x="14" y="3" width="7" height="7" rx="1" stroke-width="2" />
              <rect x="3" y="14" width="7" height="7" rx="1" stroke-width="2" />
              <rect x="14" y="14" width="7" height="7" rx="1" stroke-width="2" />
            </svg>
            <span class="text-sm font-semibold hidden sm:block">Dashboard</span>
          </a>
        }

        <button
          type="button"
          (click)="onCartOpen()"
          class="relative flex items-center gap-2 px-3 py-2 bg-amber-500 text-white rounded-xl hover:bg-amber-600 transition-colors ml-1"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span class="text-sm font-semibold hidden sm:block">Cart</span>
          
          @if (cartCount > 0) {
            <span class="absolute -top-1.5 -right-1.5 min-w-[20px] h-[20px] px-1 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow-sm">
              {{ cartCount }}
            </span>
          }
        </button>

      </div>
    </div>
  </div>
</header>
