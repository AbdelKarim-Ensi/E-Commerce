<div class="flex items-center gap-1.5">
  <div class="flex items-center gap-0.5" [class]="starSizeClass">
    @for (i of stars; track i) {
      <span class="relative">
        <span class="text-gray-200">★</span>
        <span class="absolute inset-0 overflow-hidden" [style.width.%]="fillPercent(i)">
          <span class="text-amber-500">★</span>
        </span>
      </span>
    }
  </div>
  <span class="text-xs text-gray-500 font-medium">{{ rating }}</span>
  @if (reviews !== undefined) {
    <span class="text-xs text-gray-400">({{ formattedReviews }})</span>
  }
</div>
