@if (!isLoading() && similarProducts().length > 0) {
  <section class="mt-12 pt-8 border-t border-gray-100">
    <h2 class="text-2xl font-bold text-zinc-900 mb-6">Produits similaires</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      @for (product of similarProducts(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </section>
}
